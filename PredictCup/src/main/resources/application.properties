# --- Desarrollo: PostgreSQL via Dev Services (Quarkus levanta el contenedor) ---
# Sin jdbc.url => Quarkus arranca un contenedor postgres:16 automaticamente.
# Flyway es la unica fuente del esquema, por eso Hibernate no genera nada.
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.image-name=postgres:16-alpine
# Reuse: el contenedor Postgres persiste entre reinicios de quarkus:dev,
# así no se borran usuarios/sesiones cada vez que se reinicia el backend.
%dev.quarkus.datasource.devservices.reuse=true
%dev.quarkus.hibernate-orm.database.generation=none
# OIDC necesita credenciales de Google; en dev se desactiva para arrancar sin
# secretos. Para probar el login real: define GOOGLE_CLIENT_ID/SECRET y pon
# quarkus.oidc.enabled=true (o elimina esta linea).
# quarkus-oidc NO se usa como mecanismo de auth (chocaba con el JWT propio en /api).
# El login con Google se hace manual en AuthResource. mp-jwt valida /api.
%dev.quarkus.oidc.enabled=false
# CORS: el frontend en :3000 llama al backend en :8080 (distinto origen) en dev.
# El 'enable' es build-time -> global; los origenes (runtime) solo en dev.
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:3000
%dev.quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=Content-Type,Authorization

# --- Test: H2 en memoria (esquema via Hibernate) + Redis Dev Services ---
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.enabled=false
%test.quarkus.redis.devservices.enabled=true
# Los jobs @Scheduled se desactivan para tests deterministas.
%test.quarkus.scheduler.enabled=false
# Sin secretos de Google en los tests: se desactiva OIDC para arrancar limpio.
%test.quarkus.oidc.enabled=false

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
%prod.quarkus.datasource.username=${DATABASE_USER}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}

quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.acquisition-timeout=5S

# En dev/test no se fija host: Quarkus Dev Services levanta un contenedor Redis.
# En prod se toma de REDIS_URL.
%prod.quarkus.redis.hosts=${REDIS_URL}
quarkus.redis.timeout=5s

# quarkus-oidc queda inerte: el login con Google es manual (AuthResource).
quarkus.oidc.enabled=false

# --- Login con Google (flujo OAuth manual en AuthResource) ---
# La "Authorized redirect URI" en Google Cloud debe ser exactamente este valor.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/oidc}

# JWT propio: firma con la privada, verifica con la publica. El issuer debe
# coincidir con el usado al firmar (AuthResource).
mp.jwt.verify.issuer=${JWT_ISSUER:http://localhost:8080}
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem

# A donde redirige /auth/callback (y /auth/dev) tras emitir el JWT.
app.frontend.url=${FRONTEND_URL:http://localhost:3000/login/callback}

# --- Administradores: correos con rol ADMIN automatico al loguearse ---
app.admin.emails=${APP_ADMIN_EMAILS:juancho71096@gmail.com}

# --- Dev-login DESHABILITADO: solo se entra con Google ---
app.auth.dev-login.enabled=${APP_AUTH_DEV_LOGIN_ENABLED:false}

# --- Modo demo: siembra fixtures y simula marcadores en vivo ---
app.demo.seed-fixtures=${APP_DEMO_SEED_FIXTURES:false}
%dev.app.demo.seed-fixtures=true
app.demo.match-duration-seconds=${APP_DEMO_MATCH_DURATION_SECONDS:240}
app.demo.kickoff-spread-minutes=${APP_DEMO_KICKOFF_SPREAD_MINUTES:60}

# Intervalo del PartidoSyncJob (rapido en demo, lento en prod).
app.sync.interval=${APP_SYNC_INTERVAL:2m}
%dev.app.sync.interval=20s

# --- Almacenamiento de avatares ---
# local: guarda en disco y sirve por /api/usuarios/avatars/{f}. r2: sube a Cloudflare R2.
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.storage.avatar=${APP_STORAGE_AVATAR:local}
app.storage.local.dir=${APP_STORAGE_LOCAL_DIR:avatars}
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.access-key=${R2_ACCESS_KEY:}
app.storage.r2.secret-key=${R2_SECRET_KEY:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.public-url=${R2_PUBLIC_URL:}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
