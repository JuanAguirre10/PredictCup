worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Resuelve los nombres de servicio de Docker (para las 3 replicas de app).
    resolver 127.0.0.11 valid=10s;

    upstream backend {
        least_conn;
        server app:8080;
    }
    upstream frontend {
        server frontend:3000;
    }

    # Rate limit por IP: 30 req/min (alineado con el RateLimitFilter del backend).
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    # HTTP -> HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Frontend (Next.js)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API REST (con rate limit y ráfaga de 50)
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket de ranking en vivo
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # OAuth callback y endpoints de gestión/health/metrics
        location /auth/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /q/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    }
}
